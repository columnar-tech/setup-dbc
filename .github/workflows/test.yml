name: Test Action

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-basic:
    name: Test basic installation
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test action
        uses: ./
        with:
          version: 'latest'

      - name: Verify installation
        shell: bash
        run: |
          dbc --version
          command -v dbc || where dbc

  test-with-version:
    name: Test with specific version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test action with version
        uses: ./
        with:
          version: 'v0.2.0'

      - name: Verify version
        run: |
          VERSION=$(dbc --version)
          echo "Installed version: $VERSION"
          echo "$VERSION" | grep -q "v0.2.0" || (echo "Expected v0.2.0 but got $VERSION" && exit 1)

  test-with-drivers:
    name: Test driver installation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test with drivers
        uses: ./
        with:
          drivers: 'sqlite'

  # actions/cache only saves in its post-job step, so populating and restoring
  # the cache must happen in separate jobs.
  test-cache-populate:
    name: Test caching (populate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: First run
        uses: ./

  test-cache:
    name: Test caching
    needs: test-cache-populate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Second run (should restore from cache)
        id: second
        uses: ./

      - name: Verify cache was used
        run: |
          if [ "${{ steps.second.outputs.cache-hit }}" != "true" ]; then
            echo "Cache was not used!"
            exit 1
          fi
